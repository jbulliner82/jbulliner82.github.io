name: Evidence Portfolio Python Tests
on:
  push:
    paths:
      - 'evidence-2026/automation/**'
      - '.github/workflows/evidence-portfolio-tests.yml'
  pull_request:
    paths:
      - 'evidence-2026/automation/**'
      - '.github/workflows/evidence-portfolio-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidence-2026/automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run synthetic QA example
        run: python clean_pipeline.py --out results
      - name: Verify test cases
        run: python -m pytest -q
